<svg viewBox="0 0 1200 360" width="1200" height="360" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t">
<title id="t">pixel github stats</title>
<foreignObject width="100%" height="100%">
<div xmlns="http://www.w3.org/1999/xhtml">
<style>
@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&amp;display=swap');
*{ box-sizing:border-box; image-rendering:pixelated; }
.wrap{
  width:100%; height:360px; background:#0f0f23;
  background-image: linear-gradient(rgba(255,210,63,0.035) 1px, transparent 1px), linear-gradient(90deg, rgba(255,210,63,0.035) 1px, transparent 1px);
  background-size:20px 20px;
  border:4px solid #ffd23f; box-shadow:0 0 0 4px #0f0f23, 0 0 0 8px #ffd23f, 0 0 20px rgba(255,210,63,0.2);
  display:flex; gap:16px; padding:16px; position:relative; overflow:hidden;
}
.wrap::before{ content:""; position:absolute; inset:0; background:repeating-linear-gradient(0deg, rgba(0,0,0,0.13) 0 2px, transparent 2px 4px); pointer-events:none; }
.card{
  flex:1; background:#1a1a2e; border:3px solid #fff; box-shadow:4px 4px 0 #000;
  padding:14px 14px 12px; position:relative; z-index:2; display:flex; flex-direction:column;
}
.head{ font-family:'Press Start 2P', monospace; font-size:8px; color:#ffd23f; letter-spacing:1px; display:flex; align-items:center; gap:6px; margin-bottom:12px; }
.head .icon{ width:10px; height:10px; background:var(--c); box-shadow:1px 1px 0 #000; }
.row{ display:flex; justify-content:space-between; font-family:'Press Start 2P', monospace; font-size:7px; color:#8b8ba7; margin:7px 0 4px; }
.bar{ height:10px; background:#0f0f23; border:2px solid #2a2a4a; position:relative; overflow:hidden; }
.fill{ height:100%; background:var(--c); border-right:2px solid #fff; animation: grow 1.8s steps(12) forwards; transform-origin:left; }
@keyframes grow{ from{ width:0 } to{ width: var(--w)} }
@keyframes blink{ 0%,49%{opacity:1} 50%,100%{opacity:0} }
@keyframes float{ 0%,100%{transform:translateY(0)} 50%{transform:translateY(-3px)} }
.mini{ font-family:'Press Start 2P', monospace; font-size:6px; color:#5a5a7a; margin-top:auto; padding-top:10px; display:flex; gap:8px; flex-wrap:wrap; }
.tag{ background:#0f0f23; border:1px solid #2a2a4a; padding:4px 6px; color:#ffd23f; }
a.link{ position:absolute; inset:0; z-index:3; }
.ground{ position:absolute; bottom:0; left:0; right:0; height:8px; background: repeating-linear-gradient(90deg, #ffd23f 0 10px, #0f0f23 10px 20px); border-top:2px solid #fff; }
</style>
<div class="wrap">
  <div class="card" style="--c:#00ff88">
    <div class="head"><span class="icon" style="background:#00ff88"></span> GITHUB STATS</div>
    <div class="row"><span>COMMITS</span><span style="color:#fff">1.2k+</span></div><div class="bar"><div class="fill" style="--w:88%;--c:#00ff88"></div></div>
    <div class="row"><span>REPOS</span><span style="color:#fff">42</span></div><div class="bar"><div class="fill" style="--w:68%;--c:#61DAFB"></div></div>
    <div class="row"><span>STARS</span><span style="color:#fff">★ 180</span></div><div class="bar"><div class="fill" style="--w:54%;--c:#ffd23f"></div></div>
    <div class="row"><span>CONTRIBS</span><span style="color:#fff">365d</span></div><div class="bar"><div class="fill" style="--w:92%;--c:#ff6b6b"></div></div>
    <div class="mini"><span class="tag">LVL 99</span><span class="tag">STREAK ON</span></div>
    <a class="link" href="https://github.com/horob1" target="_blank" aria-label="github"></a>
  </div>
  <div class="card" style="--c:#7F52FF">
    <div class="head"><span class="icon" style="background:#7F52FF"></span> TOP LANGS</div>
    <div class="row"><span>TS / JS</span><span>42%</span></div><div class="bar"><div class="fill" style="--w:42%;--c:#F7DF1E"></div></div>
    <div class="row"><span>DART / FLUTTER</span><span>22%</span></div><div class="bar"><div class="fill" style="--w:22%;--c:#4fd0ff"></div></div>
    <div class="row"><span>KOTLIN / JAVA</span><span>16%</span></div><div class="bar"><div class="fill" style="--w:16%;--c:#7F52FF"></div></div>
    <div class="row"><span>PYTHON</span><span>10%</span></div><div class="bar"><div class="fill" style="--w:10%;--c:#3776AB"></div></div>
    <div class="row"><span>OTHERS</span><span>10%</span></div><div class="bar"><div class="fill" style="--w:10%;--c:#8b8ba7"></div></div>
    <div class="mini"><span class="tag" style="color:#4fd0ff">FLUTTER ★ NEW</span></div>
  </div>
  <div class="card" style="--c:#ff6b6b">
    <div class="head"><span class="icon" style="background:#ff6b6b"></span> STREAK &amp; VIEWS</div>
    <div class="row" style="justify-content:center; margin:10px 0; color:#fff; font-size:9px; text-shadow:2px 2px 0 #000">🔥 120 DAYS STREAK 🔥</div>
    <div class="bar" style="height:16px"><div class="fill" style="--w:84%;--c:#ff6b6b; display:flex; align-items:center; justify-content:center; font-family:'Press Start 2P',monospace; font-size:6px; color:#fff">84% POWER</div></div>
    <div class="row" style="margin-top:14px"><span>VIEWS</span><span style="color:#ffd23f">▓▓▓▓▓ 12k</span></div><div class="bar"><div class="fill" style="--w:62%;--c:#ffd23f"></div></div>
    <div class="mini"><span class="tag">🐶 WORKING HARD</span><span class="tag">DAILY GRIND</span></div>
  </div>
  <div class="ground"></div>
</div>
</div>
</foreignObject>
</svg>
