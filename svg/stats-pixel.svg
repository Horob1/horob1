<svg viewBox="0 0 1200 420" width="1200" height="420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t">
<title id="t">pixel github stats</title>
<foreignObject width="100%" height="100%">
<div xmlns="http://www.w3.org/1999/xhtml">
<style>
@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&amp;display=swap');
*{ box-sizing:border-box; image-rendering:pixelated; }
.wrap{
 width:100%; height:420px; background:#0f0f23;
 background-image: linear-gradient(rgba(255,210,63,0.04) 1px, transparent 1px), linear-gradient(90deg, rgba(255,210,63,0.04) 1px, transparent 1px);
 background-size:20px 20px;
 border:4px solid #ffd23f; box-shadow:0 0 0 4px #0f0f23, 0 0 0 8px #ffd23f, 0 0 20px rgba(255,210,63,0.2);
 display:flex; gap:18px; padding:20px; position:relative; overflow:hidden;
}
.wrap::before{ content:""; position:absolute; inset:0; background:repeating-linear-gradient(0deg, rgba(0,0,0,0.13) 0 2px, transparent 2px 4px); pointer-events:none; }
@keyframes fly3{ 0%{ left:-100px; top:18px } 100%{ left:1300px; top:18px } }
.spaceship3{ position:absolute; left:-100px; top:18px; font-size:22px; animation: fly3 8s linear infinite; animation-delay: 4s; z-index:4; filter: drop-shadow(2px 2px 0 #000); }
.card{
 flex:1; background:#1a1a2e; border:3px solid #fff; box-shadow:5px 5px 0 #000;
 padding:18px 16px 14px; position:relative; z-index:2; display:flex; flex-direction:column;
}
.head{ font-family:'Press Start 2P', monospace; font-size:10px; color:#ffd23f; letter-spacing:1.5px; display:flex; align-items:center; gap:8px; margin-bottom:16px; }
.head .icon{ width:12px; height:12px; background:var(--c); box-shadow:1px 1px 0 #000; }
.row{ display:flex; justify-content:space-between; font-family:'Press Start 2P', monospace; font-size:9px; color:#8b8ba7; margin:9px 0 5px; }
.row b{ color:#fff; }
.bar{ height:14px; background:#0f0f23; border:2px solid #2a2a4a; position:relative; overflow:hidden; }
.fill{ height:100%; background:var(--c); border-right:2px solid #fff; animation: grow 1.8s steps(12) forwards; transform-origin:left; }
@keyframes grow{ from{ width:0 } to{ width: var(--w)} }
.mini{ font-family:'Press Start 2P', monospace; font-size:7px; color:#5a5a7a; margin-top:auto; padding-top:14px; display:flex; gap:8px; flex-wrap:wrap; }
.tag{ background:#0f0f23; border:1px solid #2a2a4a; padding:5px 7px; color:#ffd23f; }
a.link{ position:absolute; inset:0; z-index:3; }
.ground{ position:absolute; bottom:0; left:0; right:0; height:10px; background: repeating-linear-gradient(90deg, #ffd23f 0 14px, #0f0f23 14px 28px); border-top:3px solid #fff; }
</style>
<div class="wrap">
 <div class="spaceship3">🛸</div>
 <div class="card" style="--c:#00ff88">
   <div class="head"><span class="icon" style="background:#00ff88"></span> GITHUB STATS</div>
   <div class="row"><span>COMMITS</span><b>1.2k+</b></div><div class="bar"><div class="fill" style="--w:88%;--c:#00ff88"></div></div>
   <div class="row"><span>REPOS</span><b>42</b></div><div class="bar"><div class="fill" style="--w:68%;--c:#61DAFB"></div></div>
   <div class="row"><span>STARS</span><b>★ 180</b></div><div class="bar"><div class="fill" style="--w:54%;--c:#ffd23f"></div></div>
   <div class="row"><span>CONTRIBS</span><b>365d</b></div><div class="bar"><div class="fill" style="--w:92%;--c:#ff6b6b"></div></div>
   <div class="mini"><span class="tag">LVL 99</span><span class="tag">STREAK ON</span></div>
   <a class="link" href="https://github.com/horob1" target="_blank" aria-label="github"></a>
 </div>
 <div class="card" style="--c:#7F52FF">
   <div class="head"><span class="icon" style="background:#7F52FF"></span> TOP LANGS</div>
   <div class="row"><span>TS / JS</span><span>42%</span></div><div class="bar"><div class="fill" style="--w:42%;--c:#F7DF1E"></div></div>
   <div class="row"><span>DART / FLUTTER</span><span>22%</span></div><div class="bar"><div class="fill" style="--w:22%;--c:#4fd0ff"></div></div>
   <div class="row"><span>KOTLIN / JAVA</span><span>16%</span></div><div class="bar"><div class="fill" style="--w:16%;--c:#7F52FF"></div></div>
   <div class="row"><span>PYTHON</span><span>10%</span></div><div class="bar"><div class="fill" style="--w:10%;--c:#3776AB"></div></div>
   <div class="row"><span>OTHERS</span><span>10%</span></div><div class="bar"><div class="fill" style="--w:10%;--c:#8b8ba7"></div></div>
   <div class="mini"><span class="tag" style="color:#4fd0ff">FLUTTER ★ NEW</span></div>
 </div>
 <div class="card" style="--c:#ff6b6b">
   <div class="head"><span class="icon" style="background:#ff6b6b"></span> STREAK &amp; VIEWS</div>
   <div class="row" style="justify-content:center; margin:12px 0; color:#fff; font-size:11px; text-shadow:2px 2px 0 #000">🔥 120 DAYS STREAK 🔥</div>
   <div class="bar" style="height:20px"><div class="fill" style="--w:84%;--c:#ff6b6b; display:flex; align-items:center; justify-content:center; font-family:'Press Start 2P',monospace; font-size:7px; color:#fff">84% POWER</div></div>
   <div class="row" style="margin-top:16px"><span>VIEWS</span><span style="color:#ffd23f">▓▓▓▓▓ 12k</span></div><div class="bar"><div class="fill" style="--w:62%;--c:#ffd23f"></div></div>
   <div class="mini"><span class="tag">🐶 WORKING HARD</span><span class="tag">DAILY GRIND</span></div>
 </div>
 <div class="ground"></div>
</div>
</div>
</foreignObject>
</svg>
