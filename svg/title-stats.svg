<svg viewBox="0 0 1200 170" width="1200" height="170" xmlns="http://www.w3.org/2000/svg" role="img">
<foreignObject width="100%" height="100%">
<div xmlns="http://www.w3.org/1999/xhtml">
<style>
@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&amp;display=swap');
.box{ width:100%; height:170px; display:flex; align-items:center; justify-content:center; font-family:'Press Start 2P', monospace; background: linear-gradient(180deg, #1a1a2e 0%, #0f0f23 100%); border-left:8px solid #ffd23f; box-shadow:8px 8px 0 #000; position:relative; overflow:hidden; }
.box::before{ content:""; position:absolute; inset:0; background:repeating-linear-gradient(0deg, rgba(0,0,0,0.14) 0 3px, transparent 3px 6px); pointer-events:none; }
.t{ font-size:40px; color:#ffd23f; text-shadow:5px 5px 0 #000; letter-spacing:5px; z-index:2; }
.blink{ display:inline-block; width:18px; height:32px; background:#ffd23f; margin-left:18px; box-shadow:3px 3px 0 #000; animation: b .8s steps(1) infinite; }
@keyframes b{ 0%,49%{opacity:1} 50%,100%{opacity:0} }
</style>
<div class="box"><span class="t">◆ GITHUB STATS ◆</span><span class="blink"></span></div>
</div>
</foreignObject>
</svg>
