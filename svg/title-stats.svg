<svg viewBox="0 0 1200 100" width="1200" height="100" xmlns="http://www.w3.org/2000/svg" role="img">
<foreignObject width="100%" height="100%">
<div xmlns="http://www.w3.org/1999/xhtml">
<style>
@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&amp;display=swap');
.box{ width:100%; height:100px; display:flex; align-items:center; justify-content:center; font-family:'Press Start 2P', monospace; background:#0f0f23; border:4px solid #ffd23f; box-shadow:0 0 0 4px #0f0f23, 0 0 0 8px #ffd23f; position:relative; overflow:hidden; }
.box::before{ content:""; position:absolute; inset:0; background:repeating-linear-gradient(0deg, rgba(0,0,0,0.12) 0 2px, transparent 2px 4px); pointer-events:none; }
.t{ font-size:16px; color:#ffd23f; text-shadow:3px 3px 0 #000; letter-spacing:3px; z-index:2; }
.blink{ display:inline-block; width:12px; height:16px; background:#ffd23f; margin-left:10px; box-shadow:2px 2px 0 #000; animation: b .8s steps(1) infinite; }
@keyframes b{ 0%,49%{opacity:1} 50%,100%{opacity:0} }
.corner{ position:absolute; width:10px; height:10px; border:3px solid #ffd23f; }
.corner.tl{top:8px;left:8px;border-right:none;border-bottom:none} .corner.tr{top:8px;right:8px;border-left:none;border-bottom:none} .corner.bl{bottom:8px;left:8px;border-right:none;border-top:none} .corner.br{bottom:8px;right:8px;border-left:none;border-top:none}
</style>
<div class="box"><div class="corner tl"></div><div class="corner tr"></div><div class="corner bl"></div><div class="corner br"></div><span class="t">◆ GITHUB STATS ◆</span><span class="blink"></span></div>
</div>
</foreignObject>
</svg>
