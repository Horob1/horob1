<svg fill="none" viewBox="0 0 1200 560" width="1200" height="560" xmlns="http://www.w3.org/2000/svg">
<foreignObject width="100%" height="100%">
<div xmlns="http://www.w3.org/1999/xhtml">
<style>
@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&amp;display=swap');
* { image-rendering: pixelated; }
.container {
  font-family: 'Press Start 2P', system-ui, monospace;
  width: 100%; height: 560px;
  background: #0f0f23;
  background-image:
    linear-gradient(rgba(0,255,136,0.04) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,255,136,0.04) 1px, transparent 1px);
  background-size: 20px 20px;
  border: 4px solid #00ff88;
  box-shadow: 0 0 0 4px #0f0f23, 0 0 0 8px #00ff88, 0 0 30px rgba(0,255,136,0.3);
  position: relative; overflow: hidden;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  color: #e0e0e0;
}
.scanlines::before {
  content: ""; position: absolute; inset: 0;
  background: repeating-linear-gradient(0deg, rgba(0,0,0,0.15) 0px, transparent 2px, transparent 4px);
  pointer-events: none; z-index: 5;
}
.stars { position: absolute; inset: 0; overflow: hidden; }
.star {
  position: absolute; width: 5px; height: 5px; background: #fff;
  box-shadow: 0 0 8px #fff;
  animation: twinkle var(--d) ease-in-out infinite alternate;
}
@keyframes twinkle { 0% { opacity: 0.2; transform: scale(0.6); } 100% { opacity: 1; transform: scale(1.3); } }
@keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
@keyframes bounce { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
@keyframes blink { 0%,49% { opacity: 1; } 50%,100% { opacity: 0; } }
@keyframes typing { from { width: 0; } to { width: 100%; } }
@keyframes flicker { 0%,100% { opacity: 1; } 50% { opacity: 0.92; } }
@keyframes fly {
  0% { left: -140px; opacity: 0; }
  5% { opacity: 1; }
  95% { opacity: 1; }
  100% { left: 1340px; opacity: 0; }
}
@keyframes flame { 0%,100% { transform: scaleX(0.8); opacity: 0.9; } 50% { transform: scaleX(1.2); opacity: 1; } }
.spaceship{
  position: absolute; top: 68px; left: -140px;
  font-size: 36px; line-height: 1;
  filter: drop-shadow(3px 3px 0 #000) drop-shadow(0 0 10px rgba(0,255,136,0.6));
  animation: fly 7s linear infinite;
  z-index: 4; display: flex; align-items: center; gap: 0;
}
.spaceship .flame{
  font-size: 18px; margin-left: -6px; margin-right: 2px;
  animation: flame 0.15s steps(2) infinite; filter: hue-rotate(10deg);
}
.header { display: flex; align-items: center; gap: 28px; z-index: 2; animation: float 3s ease-in-out infinite; }
.dog {
  font-size: 86px; line-height: 1;
  filter: drop-shadow(4px 4px 0 #000) drop-shadow(0 0 14px rgba(0,255,136,0.6));
  animation: bounce 0.6s steps(2) infinite;
}
.title { text-align: left; }
.title h1 {
  font-size: 34px; color: #00ff88; margin: 0;
  text-shadow: 4px 4px 0 #000, 0 0 20px rgba(0,255,136,0.6);
  letter-spacing: 3px; animation: flicker 2.5s infinite;
}
.title p {
  font-size: 11px; color: #ffd23f; margin: 12px 0 0 0;
  letter-spacing: 1px; line-height: 1.8;
}
.typewrap {
  margin-top: 24px; z-index: 2;
  background: #1a1a2e; border: 3px solid #fff;
  box-shadow: 5px 5px 0 #000;
  padding: 18px 22px; max-width: 960px;
  display: flex; align-items: center; gap: 10px;
}
.prompt { color: #00ff88; font-size: 14px; }
.typed {
  font-size: 12px; color: #fff; white-space: nowrap; overflow: hidden;
  border-right: 12px solid #fff;
  animation: typing 3s steps(40) forwards, blink 0.7s steps(1) infinite;
  max-width: 100%;
}
.sub {
  margin-top: 14px; font-size: 10px; color: #8b8ba7; z-index: 2;
  letter-spacing: 1px;
}
.skills {
  display: flex; gap: 12px; margin-top: 26px; z-index: 2;
  flex-wrap: wrap; justify-content: center;
}
.badge {
  font-family: 'Press Start 2P', monospace;
  font-size: 9px; padding: 11px 14px;
  background: #20233a; border: 2px solid #fff;
  box-shadow: 4px 4px 0 #000;
  color: #fff; display: flex; align-items: center; gap: 6px;
  animation: bounce 1.2s steps(2) infinite;
  animation-delay: calc(var(--i) * 0.12s);
}
.badge.dart { border-color: #02569B; color: #8ec9ff; }
.badge.flutter { border-color: #02569B; color: #4fd0ff; background: #0a2a4a; animation-duration: 1s; box-shadow: 4px 4px 0 #000, 0 0 14px rgba(37,150,255,0.5); }
.cloud {
  position: absolute; font-size: 22px; opacity: 0.9;
  animation: float 4s ease-in-out infinite alternate;
  filter: drop-shadow(2px 2px 0 #000);
}
.ground {
  position: absolute; bottom: 0; left: 0; right: 0; height: 12px;
  background: repeating-linear-gradient(90deg, #00ff88 0 14px, #0f0f23 14px 28px);
  border-top: 3px solid #fff;
}
</style>
<div class="container scanlines">
  <div class="stars">
    <div class="star" style="left:5%;top:12%;--d:1.2s"></div>
    <div class="star" style="left:18%;top:22%;--d:0.9s"></div>
    <div class="star" style="left:32%;top:8%;--d:1.5s"></div>
    <div class="star" style="left:48%;top:18%;--d:1.1s"></div>
    <div class="star" style="left:62%;top:10%;--d:1.3s"></div>
    <div class="star" style="left:78%;top:16%;--d:0.8s"></div>
    <div class="star" style="left:88%;top:28%;--d:1.4s"></div>
    <div class="star" style="left:12%;top:65%;--d:1s"></div>
    <div class="star" style="left:92%;top:72%;--d:1.6s"></div>
    <div class="star" style="left:25%;top:78%;--d:1.2s"></div>
    <div class="star" style="left:70%;top:80%;--d:0.95s"></div>
  </div>
  <div class="spaceship"><span>🛸</span><span class="flame">🔥</span></div>
  <div class="cloud" style="left:6%;top:6%;animation-delay:0s">☁</div>
  <div class="cloud" style="right:8%;top:14%;animation-delay:0.6s">☁</div>
  <div class="cloud" style="left:42%;top:4%;animation-delay:1s;font-size:16px">✦</div>

  <div class="header">
    <div class="dog">🐶</div>
    <div class="title">
      <h1>HOROB1.DEV</h1>
      <p>▸ PLAYER 1 READY ▸ LVL 99 DEV</p>
      <p style="color:#fff;font-size:9px;margin-top:8px">Working hard like a dog every single day</p>
    </div>
  </div>

  <div class="typewrap">
    <span class="prompt">❯</span>
    <span class="typed">Hi, I'm Horob1 — dev / dog / pixel dreamer_</span>
  </div>
  <div class="sub">▌ PRESS START TO CODE ▌ ● ● ● INSERT COIN ● ● ●</div>

  <div class="skills">
    <span class="badge" style="--i:0">JS</span>
    <span class="badge" style="--i:1">TS</span>
    <span class="badge" style="--i:2">REACT</span>
    <span class="badge" style="--i:3">NODE</span>
    <span class="badge flutter" style="--i:4">◈ FLUTTER</span>
    <span class="badge dart" style="--i:5">DART</span>
    <span class="badge" style="--i:6">PY</span>
    <span class="badge" style="--i:7">KOTLIN</span>
  </div>

  <div class="ground"></div>
</div>
</div>
</foreignObject>
</svg>
