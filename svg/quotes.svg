<svg fill="none" viewBox="0 0 846 170" width="846" height="170" xmlns="http://www.w3.org/2000/svg">
<foreignObject width="100%" height="100%">
<div xmlns="http://www.w3.org/1999/xhtml">
<style>
@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&amp;display=swap');
.container {
  font-family: 'Press Start 2P', monospace;
  width: 100%; height: 170px;
  background: #0f0f23;
  background-image:
    linear-gradient(rgba(255,210,63,0.04) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,210,63,0.04) 1px, transparent 1px);
  background-size: 16px 16px;
  border: 3px solid #ffd23f;
  box-shadow: 4px 4px 0 #000, 0 0 0 3px #0f0f23, 0 0 0 6px #ffd23f;
  border-radius: 0;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  position: relative; overflow: hidden;
  color: #fff;
}
.container::before {
  content:""; position:absolute; inset:0;
  background: repeating-linear-gradient(0deg, rgba(0,0,0,0.12) 0px, transparent 2px, transparent 4px);
  pointer-events: none;
}
@keyframes blink { 0%,49%{opacity:1} 50%,100%{opacity:0} }
@keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-4px)} }
@keyframes shine { 0%{transform:translateX(-100%)} 100%{transform:translateX(200%)} }
.quote-box {
  background: #1a1a2e; border: 2px solid #fff;
  box-shadow: 3px 3px 0 #000;
  padding: 16px 22px; z-index: 2; text-align: center;
  position: relative; overflow: hidden; max-width: 760px;
}
.quote-box::after {
  content:""; position:absolute; top:0; left:0; width:40%; height:100%;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.07), transparent);
  animation: shine 3s linear infinite;
}
.eng {
  font-size: 11px; color: #ffd23f; line-height: 1.8;
  text-shadow: 2px 2px 0 #000;
}
.vi {
  font-size: 8px; color: #8ec9ff; margin-top: 10px; line-height: 1.6;
}
.sig {
  margin-top: 12px; font-size: 7px; color: #00ff88; z-index: 2;
  letter-spacing: 1px; display: flex; align-items: center; gap: 8px;
}
.dot { width:6px; height:6px; background:#00ff88; display:inline-block; animation: blink 0.8s steps(1) infinite; }
.paw { animation: float 1.2s steps(2) infinite; display:inline-block; }
.corner { position:absolute; width:10px; height:10px; border:2px solid #ffd23f; z-index:3; }
.corner.tl{top:8px;left:8px;border-right:none;border-bottom:none}
.corner.tr{top:8px;right:8px;border-left:none;border-bottom:none}
.corner.bl{bottom:8px;left:8px;border-right:none;border-top:none}
.corner.br{bottom:8px;right:8px;border-left:none;border-top:none}
</style>
<div class="container">
  <div class="corner tl"></div><div class="corner tr"></div><div class="corner bl"></div><div class="corner br"></div>
  <div class="quote-box">
    <div class="eng">"WORKING HARD LIKE A DOG, EVERY SINGLE DAY."</div>
    <div class="vi">"Làm việc chăm chỉ như một chú chó — mỗi ngày đều cố gắng."</div>
  </div>
  <div class="sig"><span class="dot"></span> — HOROB1 — <span class="paw">🐶</span> DEV &amp; DREAMER <span class="dot" style="animation-delay:0.4s"></span></div>
</div>
</div>
</foreignObject>
</svg>
