<svg fill="none" viewBox="0 0 1200 240" width="1200" height="240" xmlns="http://www.w3.org/2000/svg">
<foreignObject width="100%" height="100%">
<div xmlns="http://www.w3.org/1999/xhtml">
<style>
@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&amp;display=swap');
.container {
 font-family: 'Press Start 2P', monospace;
 width: 100%; height: 240px;
 background: #0f0f23;
 background-image:
   linear-gradient(rgba(255,107,107,0.04) 1px, transparent 1px),
   linear-gradient(90deg, rgba(255,107,107,0.04) 1px, transparent 1px);
 background-size: 20px 20px;
 border: 4px solid #ff6b6b;
 box-shadow: 0 0 0 4px #0f0f23, 0 0 0 8px #ff6b6b, 0 0 20px rgba(255,107,107,0.25);
 display: flex; flex-direction: column;
 align-items: center; justify-content: center;
 position: relative; overflow: hidden;
 color: #fff;
}
.container::before {
 content:""; position:absolute; inset:0;
 background: repeating-linear-gradient(0deg, rgba(0,0,0,0.12) 0px, transparent 2px, transparent 4px);
 pointer-events:none;
}
@keyframes blink { 0%,49%{opacity:1} 50%,100%{opacity:0} }
@keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-4px)} }
@keyframes shine { 0%{transform:translateX(-100%)} 100%{transform:translateX(200%)} }
@keyframes flyQ { 0%{ left:-80px } 100%{ left:1280px } }
.spaceshipQ{ position:absolute; top:12px; left:-80px; font-size:20px; animation: flyQ 10s linear infinite; animation-delay:1s; z-index:4; }
.quote-box {
 background: #1a1a2e; border: 3px solid #fff;
 box-shadow: 5px 5px 0 #000;
 padding: 22px 28px; z-index: 2; text-align: center;
 position: relative; overflow: hidden; max-width: 1020px;
}
.quote-box::after {
 content:""; position:absolute; top:0; left:0; width:40%; height:100%;
 background: linear-gradient(90deg, transparent, rgba(255,255,255,0.07), transparent);
 animation: shine 3s linear infinite;
}
.eng {
 font-size: 14px; color: #ffd23f; line-height: 1.8;
 text-shadow: 3px 3px 0 #000;
}
.vi {
 font-size: 10px; color: #8ec9ff; margin-top: 14px; line-height: 1.8;
}
.sig {
 margin-top: 16px; font-size: 9px; color: #00ff88; z-index: 2;
 letter-spacing: 1px; display: flex; align-items: center; gap: 10px;
}
.dot { width:8px; height:8px; background:#00ff88; display:inline-block; animation: blink 0.8s steps(1) infinite; }
.paw { animation: float 1.2s steps(2) infinite; display:inline-block; font-size:16px; }
.corner { position:absolute; width:12px; height:12px; border:3px solid #ff6b6b; z-index:3; }
.corner.tl{top:10px;left:10px;border-right:none;border-bottom:none}
.corner.tr{top:10px;right:10px;border-left:none;border-bottom:none}
.corner.bl{bottom:14px;left:10px;border-right:none;border-top:none}
.corner.br{bottom:14px;right:10px;border-left:none;border-top:none}
.ground{ position:absolute; bottom:0; left:0; right:0; height:10px; background: repeating-linear-gradient(90deg, #ff6b6b 0 14px, #0f0f23 14px 28px); border-top:3px solid #fff; }
</style>
<div class="container">
 <div class="spaceshipQ">🛸</div>
 <div class="corner tl"></div><div class="corner tr"></div><div class="corner bl"></div><div class="corner br"></div>
 <div class="quote-box">
   <div class="eng">"WORKING HARD LIKE A DOG, EVERY SINGLE DAY."</div>
   <div class="vi">"Làm việc chăm chỉ như một chú chó — mỗi ngày đều cố gắng."</div>
 </div>
 <div class="sig"><span class="dot"></span> — HOROB1 — <span class="paw">🐶</span> DEV &amp; DREAMER <span class="dot" style="animation-delay:0.4s"></span></div>
 <div class="ground"></div>
</div>
</div>
</foreignObject>
</svg>
