<svg viewBox="0 0 1200 280" width="1200" height="280" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title">
<title id="title">pixel tech stack - horob1</title>
<foreignObject width="100%" height="100%">
<div xmlns="http://www.w3.org/1999/xhtml">
<style>
@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&amp;display=swap');
* { image-rendering: pixelated; box-sizing: border-box; }
.wrap{
  width:100%; height:280px;
  background:#0f0f23;
  background-image:
    linear-gradient(rgba(0,255,136,0.04) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,255,136,0.04) 1px, transparent 1px);
  background-size:20px 20px;
  border:4px solid #00ff88;
  box-shadow: 0 0 0 4px #0f0f23, 0 0 0 8px #00ff88, 0 0 22px rgba(0,255,136,0.25);
  position:relative; overflow:hidden;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  padding:18px 20px;
}
.wrap::before{
  content:""; position:absolute; inset:0;
  background: repeating-linear-gradient(0deg, rgba(0,0,0,0.14) 0 2px, transparent 2px 4px);
  pointer-events:none;
}
.label{
  font-family:'Press Start 2P', monospace;
  font-size:9px; color:#00ff88; letter-spacing:2px;
  background:#1a1a2e; border:2px solid #fff; box-shadow:3px 3px 0 #000;
  padding:6px 10px; z-index:2; margin-bottom:14px;
}
.grid{
  display:flex; flex-wrap:wrap; gap:10px; justify-content:center; max-width:1080px; z-index:2;
}
.pill{
  font-family:'Press Start 2P', monospace;
  font-size:7.5px; line-height:1;
  padding:10px 11px;
  background:#1a1a2e; color:#fff;
  border:2px solid var(--c, #fff);
  box-shadow:3px 3px 0 #000;
  display:flex; align-items:center; gap:7px;
  animation: bob 1.4s steps(2) infinite;
  animation-delay: calc(var(--i) * 0.07s);
  position:relative;
}
.pill::after{
  content:""; position:absolute; inset:0;
  box-shadow: inset 0 0 0 1px rgba(255,255,255,0.06);
  pointer-events:none;
}
.dot{ width:8px; height:8px; background:var(--c); box-shadow:1px 1px 0 #000; display:inline-block; flex-shrink:0; }
.pill.flutter{ background:#0a2a4a; border-color:#4fd0ff; color:#bfe9ff; box-shadow:3px 3px 0 #000, 0 0 12px rgba(79,208,255,0.45); animation-duration:1s; }
.pill.dart{ border-color:#0175C2; color:#8ec9ff; }
@keyframes bob{ 0%,100%{ transform:translateY(0)} 50%{ transform:translateY(-4px)} }
@keyframes twinkle{ 0%{opacity:.25} 100%{opacity:1} }
.star{ position:absolute; width:4px; height:4px; background:#fff; box-shadow:0 0 6px #fff; animation:twinkle var(--d) ease-in-out infinite alternate; }
.ground{ position:absolute; bottom:0; left:0; right:0; height:8px; background: repeating-linear-gradient(90deg, #00ff88 0 10px, #0f0f23 10px 20px); border-top:2px solid #fff; }
</style>
<div class="wrap">
  <div class="star" style="left:4%;top:12%;--d:1s"></div>
  <div class="star" style="left:22%;top:18%;--d:1.3s"></div>
  <div class="star" style="left:78%;top:14%;--d:0.9s"></div>
  <div class="star" style="left:92%;top:22%;--d:1.2s"></div>
  <div class="star" style="left:14%;top:78%;--d:1.1s"></div>
  <div class="star" style="left:88%;top:82%;--d:1.4s"></div>
  <div class="label">▌ MY ARSENAL ▌</div>
  <div class="grid">
    <span class="pill" style="--c:#F7DF1E;--i:0"><i class="dot"></i> JS</span>
    <span class="pill" style="--c:#3178C6;--i:1"><i class="dot"></i> TS</span>
    <span class="pill" style="--c:#61DAFB;--i:2"><i class="dot"></i> REACT</span>
    <span class="pill flutter" style="--i:3"><i class="dot" style="background:#4fd0ff"></i> FLUTTER ★</span>
    <span class="pill dart" style="--i:4"><i class="dot"></i> DART</span>
    <span class="pill" style="--c:#68A063;--i:5"><i class="dot"></i> NODE</span>
    <span class="pill" style="--c:#fff;--i:6"><i class="dot"></i> EXPRESS</span>
    <span class="pill" style="--c:#47A248;--i:7"><i class="dot"></i> MONGO</span>
    <span class="pill" style="--c:#38B2AC;--i:8"><i class="dot"></i> TAILWIND</span>
    <span class="pill" style="--c:#E34F26;--i:9"><i class="dot"></i> HTML5</span>
    <span class="pill" style="--c:#1572B6;--i:10"><i class="dot"></i> CSS3</span>
    <span class="pill" style="--c:#F05032;--i:11"><i class="dot"></i> GIT</span>
    <span class="pill" style="--c:#007ACC;--i:12"><i class="dot"></i> VS CODE</span>
    <span class="pill" style="--c:#FFCA28;--i:13"><i class="dot"></i> FIREBASE</span>
    <span class="pill" style="--c:#7F52FF;--i:14"><i class="dot"></i> KOTLIN</span>
    <span class="pill" style="--c:#007396;--i:15"><i class="dot"></i> JAVA</span>
    <span class="pill" style="--c:#3776AB;--i:16"><i class="dot"></i> PYTHON</span>
  </div>
  <div class="ground"></div>
</div>
</div>
</foreignObject>
</svg>
