<svg viewBox="0 0 800 90" width="800" height="90" xmlns="http://www.w3.org/2000/svg" role="img">
<foreignObject width="100%" height="100%">
<div xmlns="http://www.w3.org/1999/xhtml">
<style>
@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&amp;display=swap');
.box{ width:100%; height:90px; display:flex; align-items:center; justify-content:center; font-family:'Press Start 2P', monospace; background:#0f0f23; border:3px solid #ff6b6b; box-shadow:4px 4px 0 #000; position:relative; overflow:hidden; }
.box::before{ content:""; position:absolute; inset:0; background:repeating-linear-gradient(0deg, rgba(0,0,0,0.12) 0 2px, transparent 2px 4px); pointer-events:none; }
.t{ font-size:12px; color:#ff6b6b; text-shadow:3px 3px 0 #000; letter-spacing:1px; z-index:2; }
.blink{ display:inline-block; width:10px; height:14px; background:#ff6b6b; margin-left:8px; box-shadow:2px 2px 0 #000; animation: b .8s steps(1) infinite; }
@keyframes b{ 0%,49%{opacity:1} 50%,100%{opacity:0} }
.corner{ position:absolute; width:8px; height:8px; border:2px solid #ff6b6b; }
.corner.tl{top:6px;left:6px;border-right:none;border-bottom:none} .corner.tr{top:6px;right:6px;border-left:none;border-bottom:none} .corner.bl{bottom:6px;left:6px;border-right:none;border-top:none} .corner.br{bottom:6px;right:6px;border-left:none;border-top:none}
</style>
<div class="box"><div class="corner tl"></div><div class="corner tr"></div><div class="corner bl"></div><div class="corner br"></div><span class="t">◆ FAVORITE QUOTE ◆</span><span class="blink"></span></div>
</div>
</foreignObject>
</svg>
